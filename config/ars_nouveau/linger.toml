
#General settings
[general]
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "amplify=5"
	augment_limits = ["duration_down=5", "sensitive=1"]
	#Cost
	#Range: > -2147483648
	cost = 360
	#The maximum number of times this glyph may appear in a single spell
	#Range: 1 ~ 1
	per_spell_limit = 1
	#Is Starter Glyph?
	starter = false
	#Is Enabled?
	enabled = true

